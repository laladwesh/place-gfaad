# Mini PaaS edge nginx config (HTTP only — TLS added later via certbot DNS-01)
# Install: sudo cp this file to /etc/nginx/sites-available/onawie-platform.conf
#          sudo ln -sf /etc/nginx/sites-available/onawie-platform.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

# Platform UI (Next.js)
server {
    listen 80;
    server_name onawie.prasadacademic.in;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:6002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Platform API (Express + webhook)
server {
    listen 80;
    server_name api.onawie.prasadacademic.in;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
